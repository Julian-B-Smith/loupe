<!-- plan-map — the visual map of Loupe's plan (ROADMAP.md), modelled on horde's docs/design/h2-plan-map.html.
     Loupe lead session, 2026-10-17. Julian: "How many stages left until this is in functional shape? Could you look
     at horde's /docs/design/h2-plan-map.html and create something similar for Loupe?"

     WHAT THIS PAGE IS. One box per part of Loupe, an edge per dependency (prerequisite -> dependent), colour by
     status, the path to v1 ("functional": run Loupe in a repo and get a crawled, structured, readable map delivered
     there, with a diff on the next run) highlighted. Clicking a box shows what the part is, its status, its open
     decisions, and the ROADMAP rows and ADRs it cites, READ LIVE from ROADMAP.md and docs/decisions/README.md. The
     page never restates a row's state as its own: ROADMAP.md is the single source of truth.

     THE DATA BLOCK (DATA below) is written by hand from ROADMAP.md (main at 0536481 plus this change) and the ADRs it
     cites. An edge's basis is the row, phase or ADR that makes it a dependency; an edge whose basis is 'inferred' is
     this map's own reading and is drawn dashed.

     SELF-CHECKS (?check=1, or the button), each with a must-fail control that must go red:
       1. every cited row (Q-xxx), phase (P1a...) and ADR exists in the served ROADMAP.md / decisions index
          (control: a planted part citing Q-9999);
       2. the dependency graph has no cycle (control: a planted back-edge v1 -> harness);
       3. every edge names real parts and every status is in the vocabulary (control: an edge to 'nope');
       4. the highlighted path is a chain of real edges ending at 'v1' and no longer chain into 'v1' exists
          (control: the path with one part removed).
     Check 1 reads files over HTTP: serve the repo (npm run view, then /docs/plan-map.html); opened as a file it
     reports SKIP, never a pass. URL: ?theme=dark · ?check=1 · ?part=<id>. Nothing is stored; nothing reads a clock. -->

<body>
<div class="wrap">

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const STATUSES = ['built', 'in progress', 'ready', 'planned', 'later', 'parked'];
const SCOLOR = { built: 'var(--s-built)', 'in progress': 'var(--s-progress)', ready: 'var(--s-ready)', planned: 'var(--s-planned)', later: 'var(--s-later)', parked: 'var(--s-parked)' };
// Status says how far along a part is; whether v1 needs it is separate (the box outline), so a planned part off
// the v1 path never reads "before v1".
const SLABEL = { built: 'built', 'in progress': 'in progress', ready: 'ready to start', planned: 'planned', later: 'after v1', parked: 'parked' };

// The plan's structure, by hand from ROADMAP.md. deps: [prerequisite id, basis]; basis 'inferred' = this map's reading.
const DATA = {
  asOf: '2026-10-17',
  records: 'ROADMAP on main d93dcf0 (Q-019 merged as PR #27)',
  nodes: [
    { id: 'harness', name: 'Harness and oracle', status: 'built', v1: true, rows: ['P0', 'Q-001', 'Q-002'], adrs: [], deps: [],
      what: 'The project scaffolding: ./verify (kit integrity, leak gate, mutation tests, every gate below), CI, the manifest, traces and the knowledge loop.' },

      what: 'Flow and design views, the conservation meter, fold, isolate, history, lenses, "How it works" stories, loose nodes; a headless render test in ./verify.' },

    { id: 'delivery', name: 'The skill in a target repo (P6)', status: 'planned', v1: true, rows: ['P6'], adrs: ['0009', '0011', '0021'], deps: [['structure', '0009'], ['p1gates', 'inferred'], ['dialogue', 'inferred']],
      what: '/loupe run in the target repo\'s own session: .loupe/current/ (gitignored there), snapshots on a loupe-history branch after the leak check, a visual diff on every later run. Opens with the P6 notice to HORDE.',

    { id: 'v1', name: 'v1: Loupe works', status: 'planned', v1: true, rows: ['P1a', 'P3', 'P6'], adrs: ['0009'], deps: [['delivery', 'P6'], ['dialogue', 'P3'], ['p1gates', 'P1a'], ['renderer', 'inferred']],

      what: 'Explainers anchored to file hashes, flagged stale after an edit; a navigator through the map.' },
    { id: 'rules', name: 'Rules export (P6r)', status: 'later', v1: false, rows: ['P6r'], adrs: ['0034'], deps: [['delivery', 'P6r'], ['audit', 'P6r']],
      what: 'A confirmed claim becomes a deterministic check the target repo commits and runs in its own CI.' },

      what: 'tokens.css and primitives.json generated from design/system/, the prototype wired to real data.' },
    { id: 'px', name: 'Pre-ship IP re-scan (PX)', status: 'later', v1: false, rows: ['PX'], adrs: [], deps: [['v1', 'PX']],
      what: 'Before any public release: the prior-art doc refreshed with a patent and IP pass.' },
    { id: 'engine2', name: 'engine2 from HORDE\'s declaration', status: 'ready', v1: false, rows: ['Q-015'], adrs: [], deps: [['emit', 'Q-015'], ['viewer', 'Q-015'], ['inferredmap', 'Q-015']],
      what: 'HORDE declared engine2\'s structure as gated data (on horde main at 0e577fc). Loupe draws it deterministically: schema 0.4 (your approval) and one adapter. The parked inferred map measures how close inference got.',
      decisions: ['Approve schema 0.4\'s structure layer when drafted'] },
    { id: 'inferredmap', name: 'engine2 inferred map', status: 'parked', v1: false, rows: ['Q-014'], adrs: [], deps: [],
      what: 'An agent\'s spec-only map of engine2, kept on a branch as the measured check for the declared one.' },
    { id: 'symbols', name: 'Symbols and calls (P1b)', status: 'parked', v1: false, rows: ['P1b'], adrs: ['0032'], deps: [],
      what: 'Not started until a named question cannot be answered at file level.' },

};
const byId = (nodes) => Object.fromEntries(nodes.map((n) => [n.id, n]));

// ---------------- graph helpers (pure) ----------------
function topo(nodes) {
  const m = byId(nodes), indeg = {}, out = {};
  for (const n of nodes) { indeg[n.id] = 0; out[n.id] = []; }
  for (const n of nodes) for (const [d] of n.deps) if (m[d]) { indeg[n.id]++; out[d].push(n.id); }
  const q = nodes.filter((n) => !indeg[n.id]).map((n) => n.id).sort(), order = [];
  while (q.length) { const id = q.shift(); order.push(id); for (const x of out[id]) if (!--indeg[x]) q.push(x); q.sort(); }
  return { order, cyclic: order.length < nodes.length, stuck: nodes.map((n) => n.id).filter((id) => !order.includes(id)) };
}
function depths(nodes) { // longest path from a root
  const m = byId(nodes), d = {};
  for (const id of topo(nodes).order) d[id] = Math.max(0, ...m[id].deps.filter(([p]) => m[p]).map(([p]) => d[p] + 1));
  return d;
}
function longestInto(nodes, target) { // the longest chain of prerequisites ending at target
  const m = byId(nodes), best = {};
  const go = (id) => { if (best[id]) return best[id]; const ps = m[id].deps.map(([p]) => p).filter((p) => m[p]).sort(); let b = [id]; for (const p of ps) { const c = go(p).concat(id); if (c.length > b.length) b = c; } return (best[id] = b); };
  return go(target);
}

// ---------------- self-checks, each run against a planted fault too ----------------
function checkCitations(nodes, known) {
  const bad = []; for (const n of nodes) { for (const r of n.rows) if (!known.rows.has(r)) bad.push(`${n.id}: ${r}`); for (const a of n.adrs) if (!known.adrs.has(a)) bad.push(`${n.id}: ADR ${a}`); for (const [, b] of n.deps) if (b !== 'inferred' && !known.rows.has(b) && !known.adrs.has(b)) bad.push(`${n.id}: basis ${b}`); }
  return { ok: !bad.length, msg: bad.length ? 'not found: ' + bad.join(', ') : 'every cited row, phase and ADR exists' };
}
function checkAcyclic(nodes) { const t = topo(nodes); return { ok: !t.cyclic, msg: t.cyclic ? 'cycle through: ' + t.stuck.join(', ') : 'acyclic, ' + nodes.length + ' parts' }; }
function checkRefs(nodes) {
  const m = byId(nodes), bad = [];
  for (const n of nodes) { if (!STATUSES.includes(n.status)) bad.push(`${n.id}: status ${n.status}`); for (const [d] of n.deps) if (!m[d]) bad.push(`${n.id} -> ${d}`); }
  return { ok: !bad.length, msg: bad.length ? bad.join(', ') : 'every edge names a real part; every status is in the vocabulary' };
}
function checkPath(nodes, path) {
  const m = byId(nodes);
  if (path[path.length - 1] !== 'v1') return { ok: false, msg: 'does not end at v1' };
  for (let i = 1; i < path.length; i++) if (!m[path[i]] || !m[path[i]].deps.some(([d]) => d === path[i - 1])) return { ok: false, msg: `${path[i - 1]} -> ${path[i]} is not an edge` };
  const L = longestInto(nodes, 'v1').length;
  return { ok: path.length === L, msg: path.length === L ? `a real chain of ${L} parts, the longest into v1` : `length ${path.length}, but the longest is ${L}` };
}
async function known() {
  const get = async (u) => { const r = await fetch(u); if (!r.ok) throw new Error(u + ' ' + r.status); return r.text(); };
  const road = await get('../ROADMAP.md'), dec = await get('decisions/README.md');
  const rows = new Set([...road.matchAll(/^### (Q-\d{3})/gm)].map((m) => m[1]).concat([...road.matchAll(/^\| \*\*(P\w+)\*\*/gm)].map((m) => m[1])));
  const adrs = new Set([...dec.matchAll(/^\| \[(\d{4})\]/gm)].map((m) => m[1]));
  return { rows, adrs, road };
}
async function runChecks() {
  const N = DATA.nodes, rows = [], add = (name, real, ctl) => rows.push({ name, real, ctl });
  let K = null;
  try { K = await known(); } catch (e) { /* opened as a file: check 1 cannot run */ }
  const planted = N.concat([{ id: 'plant', name: 'plant', status: 'planned', rows: ['Q-9999'], adrs: [], deps: [] }]);
  if (K) add('1 citations', checkCitations(N, K), checkCitations(planted, K));
  else add('1 citations', { skip: true, msg: 'needs the page served (npm run view); opened as a file it cannot read ROADMAP.md' }, { skip: true, msg: '' });
  const back = N.map((n) => n.id === 'harness' ? { ...n, deps: [['v1', 'inferred']] } : n);
  add('2 acyclic', checkAcyclic(N), checkAcyclic(back));
  add('3 references', checkRefs(N), checkRefs(N.concat([{ id: 'x', name: 'x', status: 'planned', rows: [], adrs: [], deps: [['nope', 'inferred']] }])));
  const path = longestInto(N, 'v1');
  add('4 v1 path', checkPath(N, path), checkPath(N, path.filter((_, i) => i !== 1)));
  const cell = (r, wantOk) => r.skip ? '<span class="skip">SKIP</span>' : (r.ok === wantOk ? '<span class="ok">' : '<span class="bad">') + (r.ok ? 'pass' : 'fail') + '</span>';
  $('chkrows').innerHTML = rows.map((r) => `<div class="r"><b>${esc(r.name)}</b><div>${cell(r.real, true)} ${esc(r.real.msg)}<br><span style="color:var(--faint)">control (must fail): ${cell(r.ctl, false)} ${esc(r.ctl.msg)}</span></div></div>`).join('');
  $('chk').hidden = false;
  const allGood = rows.every((r) => r.real.skip || (r.real.ok && !r.ctl.ok));
  return allGood;
}

// ---------------- layout and drawing ----------------
const NW = 190, NH = 52, COLW = 214, ROWH = 92, PADX = 16, PADY = 18;
function layout(nodes) {
  const d = depths(nodes), maxD = Math.max(...Object.values(d)), pos = {}, rows = {};
  const rowOf = (n) => n.status === 'parked' ? maxD + 1 : d[n.id];
  for (const n of nodes) (rows[rowOf(n)] = rows[rowOf(n)] || []).push(n);
  let widest = 0;
  for (let r = 0; r <= maxD + 1; r++) {
    const row = rows[r] || [];

    const bc = (n) => { const xs = n.deps.map(([p]) => pos[p]).filter(Boolean).map((p) => p.c); return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0; };
    row.sort((a, b) => bc(a) - bc(b) || (a.v1 === b.v1 ? 0 : a.v1 ? -1 : 1) || (a.id < b.id ? -1 : 1));

}
const ST = { sel: null, crit: [] };
function wrap(text, max) { const words = text.split(' '), lines = ['']; for (const w of words) { const l = lines[lines.length - 1]; if ((l + ' ' + w).trim().length > max && l) lines.push(w); else lines[lines.length - 1] = (l + ' ' + w).trim(); } return lines.slice(0, 2); }
function render() {
  const N = DATA.nodes, m = byId(N), L = layout(N), crit = new Set(ST.crit), critE = new Set();
  for (let i = 1; i < ST.crit.length; i++) critE.add(ST.crit[i - 1] + '>' + ST.crit[i]);
  const near = new Set(); if (ST.sel) { near.add(ST.sel); for (const [d] of m[ST.sel].deps) near.add(d); for (const n of N) if (n.deps.some(([d]) => d === ST.sel)) near.add(n.id); }
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${L.w}" height="${L.h}" viewBox="0 0 ${L.w} ${L.h}" role="img" aria-label="Loupe plan: ${N.length} parts and their dependencies">`;
  for (const n of N) for (const [d, basis] of n.deps) {
    const a = L.pos[d], b = L.pos[n.id]; if (!a || !b) continue;
    const x1 = a.x + NW / 2, y1 = a.y + NH, x2 = b.x + NW / 2, y2 = b.y, my = (y1 + y2) / 2;
    const isC = critE.has(d + '>' + n.id), dim = ST.sel && !(near.has(d) && near.has(n.id));
    s += `<path d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}" fill="none" stroke="${isC ? 'var(--accent)' : 'var(--faint)'}" stroke-width="${isC ? 3 : 1.4}" stroke-dasharray="${basis === 'inferred' ? '5 4' : 'none'}" opacity="${dim ? 0.15 : isC ? 1 : 0.7}"><title>${esc(d + ' → ' + n.id + ' (' + (basis === 'inferred' ? 'inferred by this map' : basis) + ')')}</title></path>`;
  }
  for (const n of N) {
    const p = L.pos[n.id], isC = crit.has(n.id), sel = ST.sel === n.id, dim = ST.sel && !near.has(n.id);
    const lines = wrap(n.name, 24);

    s += `<rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="8" fill="var(--well)" stroke="${sel || isC ? 'var(--accent)' : 'var(--rule)'}" stroke-width="${sel ? 2.5 : isC ? 2 : 1}" ${n.v1 ? '' : 'stroke-dasharray="4 3"'}/>`;
    s += `<rect x="${p.x}" y="${p.y}" width="6" height="${NH}" rx="3" fill="${SCOLOR[n.status]}"/>`;
    lines.forEach((t, i) => { s += `<text x="${p.x + 14}" y="${p.y + 19 + i * 16}" font-size="13" font-weight="700" fill="var(--fg)">${esc(t)}</text>`; });
    if (lines.length < 2) s += `<text x="${p.x + 14}" y="${p.y + 37}" font-size="11.5" fill="var(--muted)">${esc(SLABEL[n.status])}</text>`;

}
function legend() {
  $('legend').innerHTML = STATUSES.map((k) => `<span><i style="background:${SCOLOR[k]}"></i>${esc(SLABEL[k])}</span>`).join('')
    + '<span><i class="line"></i>dependency (cites a row, phase or ADR)</span><span><i class="line dash"></i>inferred by this map</span><span><i class="line crit"></i>path to v1</span><span><i style="border:1px dashed var(--faint);background:transparent"></i>not needed for v1</span>';
}
let ROAD = null;
function rowInfo(id) {
  if (!ROAD) return null;
  if (/^Q-/.test(id)) { const i = ROAD.indexOf('### ' + id); if (i < 0) return null; const blk = ROAD.slice(i, ROAD.indexOf('\n### ', i + 4) > 0 ? ROAD.indexOf('\n### ', i + 4) : undefined); const title = blk.split('\n')[0].replace(/^### Q-\d+ — /, ''); const st = (/\*\*Status:\*\*\s*([^\n]*)/.exec(blk) || [])[1] || ''; return { title, st: st.split(/[.;(]/)[0] }; }
  const m = new RegExp('^\\| \\*\\*' + id + '\\*\\*([^|]*)\\|([^|]*)\\|', 'm').exec(ROAD); return m ? { title: (m[1] + ' ' + m[2]).replace(/\s+/g, ' ').trim().slice(0, 150) + '…', st: '' } : null;
}
function side() {
  const id = ST.sel, m = byId(DATA.nodes);
  if (!id) { $('side').innerHTML = '<h3>Click a part</h3><p>Each box is one part of Loupe. The coloured bar is its status; an accent outline marks the path to v1; a dashed outline marks a part v1 does not need. Solid edges cite the ROADMAP row, phase or ADR that makes them a dependency; dashed edges are this map\'s own reading (hover an edge to see which).</p><p style="margin-top:6px">ROADMAP.md outranks this page: the rows shown for a part are read from it live.</p>'; return; }
  const n = m[id], deps = n.deps.map(([d, b]) => `<li>${esc(m[d] ? m[d].name : d)} <span style="color:var(--faint)">(${esc(b)})</span></li>`).join('') || '<li>none</li>';
  const users = DATA.nodes.filter((x) => x.deps.some(([d]) => d === id)).map((x) => `<li>${esc(x.name)}</li>`).join('') || '<li>none</li>';
  const rows = n.rows.map((r) => { const i = rowInfo(r); return `<div class="row"><code>${esc(r)}</code> ${i ? `<b>${esc(i.title)}</b>${i.st ? `<br><span class="st">${esc(i.st)}</span>` : ''}` : '<span class="st">(served page reads ROADMAP.md live)</span>'}</div>`; }).join('');
  $('side').innerHTML = `<div class="eyebrow">${esc(n.v1 ? 'needed for v1' : 'not needed for v1')}</div><h2>${esc(n.name)}</h2><span class="pill" style="background:${SCOLOR[n.status]}">${esc(SLABEL[n.status])}</span>
    <p style="margin-top:8px">${esc(n.what)}</p>
    ${n.decisions ? `<h3>Your open decisions</h3><ul>${n.decisions.map((d) => `<li>${esc(d)}</li>`).join('')}</ul>` : ''}
    <h3>Needs</h3><ul>${deps}</ul><h3>Needed by</h3><ul>${users}</ul>
    <h3>ROADMAP</h3>${rows || '<p>no rows</p>'}${n.adrs.length ? `<h3>Decisions</h3><p>${n.adrs.map((a) => `ADR ${esc(a)}`).join(' · ')}</p>` : ''}`;
}
function answer() {
  const N = DATA.nodes, need = N.filter((n) => n.v1 && n.id !== 'v1'), left = need.filter((n) => n.status !== 'built');
  const stages = [['P1a finish', ['langs', 'dialect', 'oplens', 'p1gates']], ['P2 renderer gates', ['nodekinds', 'renderer']], ['P3 structure + dialogue', ['structure', 'dialogue']], ['P6 delivery as a skill', ['delivery']]];
  const remaining = stages.filter(([, ids]) => ids.some((i) => byId(N)[i].status !== 'built'));
  $('answer').innerHTML = `<div><div class="eyebrow">Stages left to v1</div><div class="n">${remaining.length}</div><p>${remaining.map(([s]) => esc(s)).join(' → ')}</p></div>
    <div><div class="eyebrow">Parts v1 needs</div><div class="n">${need.length - left.length} / ${need.length}</div><p>built; ${left.length} still to do (${left.filter((n) => n.status === 'in progress').length} in progress)</p></div>
    <div><div class="eyebrow">After v1</div><div class="n">${N.filter((n) => n.status === 'later').length}</div><p>audit, explainers, rules export, design system, the IP re-scan</p></div>
    <div><div class="eyebrow">Ready now, off the path</div><div class="n">${N.filter((n) => n.status === 'ready').length}</div><p>${esc(N.filter((n) => n.status === 'ready').map((n) => n.name).join(', '))}</p></div>`;
}
function order() {
  const m = byId(DATA.nodes);
  $('order').innerHTML = ST.crit.map((id, i) => `<div class="step" data-part="${id}" tabindex="0" role="button"><span class="k">${i + 1} · ${esc(SLABEL[m[id].status])}</span><br><b>${esc(m[id].name)}</b></div>`).join('');
}
function select(id) { ST.sel = id && byId(DATA.nodes)[id] ? id : null; render(); side(); }
function onPick(e) { const g = e.target.closest('[data-part]'); if (g) select(ST.sel === g.dataset.part ? null : g.dataset.part); }

async function boot() {
  const q = new URLSearchParams(location.search);
  theme(q.get('theme') === 'dark' || (!q.get('theme') && matchMedia('(prefers-color-scheme: dark)').matches));
  ST.crit = longestInto(DATA.nodes, 'v1');

  $('theme').onclick = () => theme(document.documentElement.getAttribute('data-theme') !== 'dark');
