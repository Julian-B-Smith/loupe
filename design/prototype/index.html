<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loupe</title>
<link rel="stylesheet" href="../tokens.css">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--loupe-surface-page);color:var(--loupe-ink);font:var(--loupe-type-panel-body)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--loupe-focus-ring);outline-offset:2px;border-radius:4px}
a{color:var(--loupe-accent)}a:hover{color:var(--loupe-ink)}
.mono{font:var(--loupe-type-node-label);letter-spacing:var(--loupe-tracking-node-label)}
.eyebrow{font:var(--loupe-type-eyebrow);letter-spacing:var(--loupe-tracking-eyebrow);text-transform:uppercase;color:var(--loupe-ink-faint)}
.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px 18px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--loupe-rule)}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand b{font:700 19px/24px var(--loupe-font-ui);letter-spacing:-.02em}
.brand span{font:var(--loupe-type-count);color:var(--loupe-ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.meter{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;text-align:left}
.meter i{width:9px;height:9px;border-radius:50%;flex:none}
.meter b{font:500 13px/16px var(--loupe-font-ui)}
.meter small{font:var(--loupe-type-count);color:var(--loupe-ink-faint)}
.seg{display:flex;padding:2px;gap:2px;border-radius:7px;background:var(--loupe-surface-group-nested)}
.seg button{padding:4px 10px;border-radius:5px;font:500 12.5px/16px var(--loupe-font-ui);color:var(--loupe-ink-muted)}
.seg button:disabled{opacity:.35;cursor:default}
.seg button[aria-pressed="true"]{background:var(--loupe-surface-node);color:var(--loupe-ink);box-shadow:0 0 0 1px var(--loupe-rule)}
.seg .lbl{padding:4px 6px 4px 8px;font:var(--loupe-type-caption);color:var(--loupe-ink-faint);align-self:center}
.stages{display:flex;gap:2px;padding:6px 12px;border-bottom:1px solid var(--loupe-rule);overflow-x:auto;scrollbar-width:none}
.stages::-webkit-scrollbar{display:none}
.stg{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:6px;white-space:nowrap;font:500 13px/16px var(--loupe-font-ui);color:var(--loupe-ink-muted)}
.stg i{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;font:var(--loupe-type-count);font-style:normal;border:1px solid var(--loupe-rule);color:var(--loupe-ink-faint)}
.stg:hover{background:var(--loupe-surface-group-nested)}
.stg[aria-current="step"]{background:var(--loupe-surface-group);color:var(--loupe-ink)}
.stg[aria-current="step"] i{background:var(--loupe-ink);border-color:var(--loupe-ink);color:var(--loupe-surface-node)}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
.canvas{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--loupe-surface-canvas);touch-action:none;cursor:grab}
.canvas.dragging{cursor:grabbing}
.canvas.can-move{cursor:move}
.canvas.moving{cursor:move}
.float{position:absolute;display:flex;gap:6px;background:var(--loupe-surface-panel);border-radius:var(--loupe-radius-panel);box-shadow:0 0 0 1px var(--loupe-rule)}
.legend{left:12px;bottom:12px;padding:10px 12px;gap:14px;flex-wrap:wrap;max-width:calc(100% - 96px)}
.legend .col{display:grid;gap:3px;align-content:start}
.legend .col+.col{padding-left:14px;border-left:1px solid var(--loupe-rule)}
.lk{display:flex;align-items:center;gap:7px;font:var(--loupe-type-caption);color:var(--loupe-ink-muted);text-align:left}
.lk[aria-pressed="false"]{opacity:.35}
.legend.closed .col{display:none}
.legend .strip{display:none;gap:6px;align-items:center}
.legend.closed .strip{display:flex}
.legend .kt{font:var(--loupe-type-eyebrow);letter-spacing:var(--loupe-tracking-eyebrow);text-transform:uppercase;color:var(--loupe-ink-faint);align-self:flex-start}
.legend.closed{padding:6px 10px}
.zoom{right:12px;bottom:12px;flex-direction:column;gap:0;overflow:hidden}
.zoom button{width:36px;height:34px;font:500 16px/1 var(--loupe-font-ui);color:var(--loupe-ink-muted)}
.zoom button+button{border-top:1px solid var(--loupe-rule)}
.zoom .lod{font:var(--loupe-type-count);padding:6px 0;text-align:center;color:var(--loupe-ink-faint);border-top:1px solid var(--loupe-rule);width:36px;white-space:nowrap}
.settings{right:12px;top:12px;padding:3px}
.iso{left:12px;top:12px;padding:6px 8px 6px 12px;align-items:center;gap:10px}
.iso[hidden]{display:none}
.works{position:absolute;inset:0;overflow:hidden;z-index:0}
.float{z-index:2}
.seg[hidden]{display:none}
.wk-world{position:absolute;left:0;top:0;transform-origin:0 0}
.wk-svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.wk-card,.wk-out{position:absolute;box-sizing:border-box;padding:10px 12px;display:flex;flex-direction:column;gap:4px;overflow:hidden;cursor:pointer}
.wk-card{cursor:grab}
.wk-head{display:flex;justify-content:space-between;gap:8px;font:var(--loupe-type-eyebrow);letter-spacing:var(--loupe-tracking-eyebrow);text-transform:uppercase;color:var(--loupe-ink-faint)}
.wk-tag.wk-annotated{color:var(--loupe-ink)}.wk-tag.wk-pinned{color:var(--loupe-state-ok)}
.wk-label{font:600 14px/18px var(--loupe-font-ui);color:var(--loupe-ink)}
.wk-does{font:var(--loupe-type-caption);color:var(--loupe-ink-muted)}
.wk-files{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.wk-file{font:var(--loupe-type-count);padding:2px 6px;border-radius:4px;background:var(--loupe-surface-group-nested);color:var(--loupe-ink-muted);cursor:pointer}
.wk-file.on{box-shadow:0 0 0 1.5px var(--loupe-accent);color:var(--loupe-ink)}.wk-file.unknown{text-decoration:line-through}
.wk-out .wk-role{display:flex;justify-content:space-between;font:var(--loupe-type-count);color:var(--loupe-ink-muted)}
.wk-pill{position:absolute;transform:translate(-50%,-50%);font:var(--loupe-type-count);padding:2px 7px;border-radius:999px;border:1px solid;background:var(--loupe-surface-panel);color:var(--loupe-ink);white-space:nowrap;pointer-events:none}
.fld{width:100%;box-sizing:border-box;font:var(--loupe-type-panel-body);padding:6px 8px;border-radius:6px;border:1px solid var(--loupe-rule);background:var(--loupe-surface-node);color:var(--loupe-ink);resize:vertical}
.fld:focus{outline:2px solid var(--loupe-focus-ring);outline-offset:0}
.ctx{position:absolute;z-index:10;min-width:230px;max-width:320px;max-height:calc(100% - 8px);overflow-y:auto;padding:4px;background:var(--loupe-surface-panel);border-radius:var(--loupe-radius-panel);box-shadow:0 0 0 1px var(--loupe-rule),0 8px 24px rgb(0 0 0 / .18);display:flex;flex-direction:column}
.ctx button{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 10px;border-radius:6px;text-align:left;font:500 13px/16px var(--loupe-font-ui)}
.ctx button:hover:not(:disabled),.ctx button:focus-visible{background:var(--loupe-surface-group-nested);outline:none}
.ctx button:disabled{opacity:.4;cursor:default}
.ctx .l{display:flex;flex-direction:column;min-width:0}
.ctx small{font:var(--loupe-type-caption);color:var(--loupe-ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx kbd{font:var(--loupe-type-count);color:var(--loupe-ink-faint)}
.ctx .sep{height:1px;margin:4px 6px;background:var(--loupe-rule)}
.iso b{font:600 13px/16px var(--loupe-font-ui)}
.panel{border-left:1px solid var(--loupe-rule);background:var(--loupe-surface-panel);min-height:0;display:flex;flex-direction:column}
.handle{display:none}
.pbody{overflow-y:auto;padding:18px 20px 28px;display:flex;flex-direction:column;gap:14px;min-height:0;flex:1}
.pbody h2{margin:0;font:var(--loupe-type-panel-title);letter-spacing:-.015em;overflow-wrap:anywhere;text-wrap:balance}
.pbody p{margin:0;color:var(--loupe-ink-muted);text-wrap:pretty}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.path{font:var(--loupe-type-count);color:var(--loupe-ink-faint);overflow-wrap:anywhere}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;font:var(--loupe-type-caption);color:var(--loupe-ink-faint)}
.crumbs button{color:var(--loupe-accent)}
.list{display:flex;flex-direction:column;gap:6px}
.card{display:flex;flex-direction:column;gap:5px;padding:10px 12px;border-radius:8px;background:var(--loupe-surface-group);box-shadow:inset 0 0 0 1px var(--loupe-rule);text-align:left;width:100%}
button.card:hover{box-shadow:inset 0 0 0 1px var(--loupe-ink-faint)}
.card.on{box-shadow:inset 0 0 0 2px var(--loupe-accent)}
.card .t{font:500 13px/17px var(--loupe-font-ui)}
.card .s{font:var(--loupe-type-caption);color:var(--loupe-ink-muted);text-wrap:pretty}
.card .m{font:var(--loupe-type-count);color:var(--loupe-ink-faint)}
.chip{font:var(--loupe-type-eyebrow);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.erow{display:grid;grid-template-columns:30px 14px minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px solid var(--loupe-rule);text-align:left;width:100%}
.erow:hover{background:var(--loupe-surface-group)}
.erow .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.erow .m{font:var(--loupe-type-caption);color:var(--loupe-ink-faint);white-space:nowrap}
.btn{padding:6px 12px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--loupe-rule);font:500 13px/16px var(--loupe-font-ui)}
.btn.primary{background:var(--loupe-ink);color:var(--loupe-surface-node);box-shadow:none}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font:var(--loupe-type-caption)}
.kv dt{color:var(--loupe-ink-faint)}.kv dd{margin:0;color:var(--loupe-ink);overflow-wrap:anywhere}
table.t{border-collapse:collapse;width:100%;font:var(--loupe-type-caption);font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:5px 4px;border-bottom:1px solid var(--loupe-rule);text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--loupe-ink-faint);font-weight:500}
.err{padding:24px;color:var(--loupe-state-bad)}
@media (max-width:720px){
  .top{padding:8px 12px}.brand span{display:none}
  main{grid-template-columns:minmax(0,1fr)}
  .settings{top:8px;right:8px}
  .panel{position:fixed;left:0;right:0;bottom:0;height:62vh;border-left:0;border-top:1px solid var(--loupe-rule);border-radius:14px 14px 0 0;transform:translateY(calc(100% - 76px));transition:transform .25s cubic-bezier(.2,.7,.2,1);z-index:5}
  .panel.open{transform:none}
  .handle{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 16px 4px;width:100%}
  .handle::before{content:"";width:36px;height:4px;border-radius:2px;background:var(--loupe-rule)}
  .handle span{font:500 13px/16px var(--loupe-font-ui);align-self:stretch;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pbody{padding-top:6px}
  .zoom{bottom:88px}
}
@media (prefers-reduced-motion: reduce){.panel{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><b>Loupe</b><span id="repo"></span></div>
    <div class="tools">
      <button class="meter" id="meter" title="Conservation check"></button>
      <div class="seg" id="histSeg"><button id="hBack" aria-label="Back">←</button><button id="hFwd" aria-label="Forward">→</button></div>
      <div class="seg" id="lensSeg" title="Focus lens (ADR 0019): show only what the product depends on; the rest is one counted box"><span class="lbl">Lens</span><button data-lens="">All</button><button data-lens="operational">Operational</button></div>
      <div class="seg" id="viewSeg"><button data-view="flow">Flow</button><button data-view="design">Design</button><button data-view="works" title="How the code works, told as stories (ADR 0025). Inferred by the agent; yours to edit.">How it works</button></div>
      <div class="seg" id="diffSeg"><span class="lbl">Re-run</span><button data-diff="off">Off</button><button data-diff="before">Before</button><button data-diff="after">After</button></div>
      <div class="seg"><button id="theme">Dark</button></div>
    </div>
  </header>
  <nav class="stages" id="stages" aria-label="Pipeline stages"></nav>
  <main>
    <section class="canvas" id="canvas" aria-label="Map">
      <div class="float settings" style="gap:6px;background:none;box-shadow:none"><div class="seg" id="hubSeg" title="Hub placement" style="box-shadow:0 0 0 1px var(--loupe-rule)"><span class="lbl">Hubs</span><button data-hub="group">With group</button><button data-hub="center">Centered</button></div><div class="seg" id="resetSeg" style="box-shadow:0 0 0 1px var(--loupe-rule)" hidden><button id="resetLayout" title="Put moved sections and levels back">Reset layout</button></div></div>
      <div class="float iso" id="storyBar" hidden><span class="eyebrow">Story</span><div class="seg" id="storySeg"></div></div>
      <div class="float iso" id="isoBar" hidden><span class="eyebrow">Isolated</span><b id="isoName"></b><span class="eyebrow" id="isoElse" style="text-transform:none;letter-spacing:0"></span><button class="btn" id="isoExit">Back to full map</button></div>
      <div class="float legend" id="legend"></div>
      <div class="float zoom"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">−</button><button id="zfit" title="Fit" style="font:var(--loupe-type-count)">fit</button><div class="lod" id="lod"></div></div>
    </section>
    <aside class="panel" id="panel"><button class="handle" id="handle"><span id="handleText"></span></button><div class="pbody" id="pbody"></div></aside>
  </main>
</div>
<script type="module">
import { loadSnapshot } from './snapshot.js';
import { createStore, createHistory, STAGES } from './state.js';
import { render, SPEC, slotOf, glyphOf } from './render.js';
import { conserve, conformity } from './standins.js';
import { LENSES } from './lens.js';
import { renderWorks, CARRIES as WK_CARRIES } from './works.js';
import { applyEdits, layoutStory, storyAccounting, storiesPath } from './story.js';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const v = n => `var(--loupe-${n})`;
const params = new URLSearchParams(location.search);
const SNAP = params.get('snapshot') || 'snapshots/horde-sample/';
const canvas = $('canvas');
const phone = () => matchMedia('(max-width:720px)').matches;

let data;
try { data = await loadSnapshot(SNAP); }
catch (err) { canvas.innerHTML = `<div class="err">${esc(err.message)}</div>`; throw err; }

// Stories (ADR 0025) live beside the prototype, keyed by repo and commit; a snapshot without one has none.
const STORY_PATH = storiesPath(data.graph);
let STORIES = [];
let STORY_HASH = '';
if (STORY_PATH) { try { const r = await fetch(STORY_PATH); if (r.ok) { const t = await r.text(); STORIES = JSON.parse(t).stories || []; let h = 5381; for (let i = 0; i < t.length; i++) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0; STORY_HASH = h.toString(36); } } catch {} }
// Keyed by the stories file's content hash too: if the agent rewrites the stories for the same commit, old edits
// must not silently land on whatever step now has their id (critic, 2026-10-08).
const EDITS_KEY = 'loupe-story-edits:' + (STORY_PATH || SNAP) + ':' + STORY_HASH;
let savedEdits = {}; try { savedEdits = JSON.parse(localStorage.getItem(EDITS_KEY) || '{}'); } catch {}
const saved = JSON.parse(localStorage.getItem('loupe-proto') || '{}');
const savedOffsets = (saved.offsets || {})[SNAP] || {};
const store = createStore({ stage: saved.stage || 2, view: STAGES[(saved.stage || 2) - 1].view, theme: saved.theme || 'light', offsets: savedOffsets, storyEdits: savedEdits });
// Julian's story edits persist in this browser until the agent commits them (exported with 'Copy edits').
store.on(s => { try { localStorage.setItem(EDITS_KEY, JSON.stringify(s.storyEdits || {})); } catch {} });
const curStory = s => STORIES.find(x => x.id === s.story) || STORIES[0] || null;
const effStory = s => { const st = curStory(s); return st ? applyEdits(st, (s.storyEdits || {})[st.id]) : null; };
const A = store.actions;
const PRIM = { section: 'Section', set: 'Set', overlap: 'Overlap', bus: 'Bus', band: 'Band', lane: 'Lane', twins: 'Twins', hub: 'Hub', loop: 'Loop' };
const STATUS = { confirmed: 'state-ok', challenged: 'state-bad', proposed: 'ink-faint', open: 'state-warn', pending: 'state-warn', established: 'ink-muted', answered: 'state-ok' };
const chip = (text, tok) => `<span class="chip" style="color:${v(tok || STATUS[text] || 'ink-faint')}">${esc(text)}</span>`;
const label = id => (data.nodes[id] && data.nodes[id].label) || (data.elements[id] && (data.elements[id].label || id)) || id;
const crumbs = sec => { const out = []; while (sec) { out.unshift(sec); sec = data.parentOf[sec]; } return out; };
const swatch = e => {
  const s = slotOf(e), g = glyphOf(e), c = v('edge-' + s), d = SPEC.dash[e.provenance] || 'none', cap = SPEC.cap[e.provenance] || 'butt';
  const head = g === 'dot' ? `<circle cx="24" cy="5" r="2.8" style="fill:${c}"/>` : `<path d="M19 1.4L27 5L19 8.6z" style="fill:${g === 'arrow-hollow' ? v('surface-panel') : c};stroke:${c};stroke-width:${g === 'arrow-hollow' ? 1.2 : 0}px"/>`;
  return `<svg width="30" height="10" aria-hidden="true"><line x1="1" y1="5" x2="${g === 'dot' ? 21 : 20}" y2="5" style="stroke:${c};stroke-width:1.5px;stroke-dasharray:${d};stroke-linecap:${cap}"/>${head}</svg>`;
};

// ---------- history (ADR 0024): Back/Forward = Undo/Redo. Labels name the step a Back would undo.
const portName = k => { const id = k.split(/:(?:s|all|f):/)[1] || k; return label(id); };
function describe(a, b) {
  const added = (x, y) => (y || []).filter(i => !(x || []).includes(i)), removed = (x, y) => (x || []).filter(i => !(y || []).includes(i));
  if (a.isolate !== b.isolate) return b.isolate ? `isolate ${label(b.isolate)}` : `back to full map from ${label(a.isolate)}`;
  if (a.lens !== b.lens) return b.lens ? `${LENSES[b.lens].label.toLowerCase()} lens` : 'show everything';
  if (a.story !== b.story) return `story: ${(STORIES.find(x => x.id === b.story) || {}).title || 'first'}`;
  if (JSON.stringify(a.storyEdits) !== JSON.stringify(b.storyEdits)) {
    const id = Object.keys({ ...a.storyEdits, ...b.storyEdits }).find(k => JSON.stringify((a.storyEdits || {})[k]) !== JSON.stringify((b.storyEdits || {})[k]));
    const x = (a.storyEdits || {})[id] || {}, y = (b.storyEdits || {})[id] || {}, J = o => JSON.stringify(o || {});
    if (!Object.keys(y).length) return 'reset story edits';
    if (J(x.pos) !== J(y.pos)) return 'move a step';
    if (J(x.requests) !== J(y.requests)) return 'add a request for the agent';
    if (J(x.added) !== J(y.added)) return 'add a step';
    const ch = Object.keys(y.steps || {}).find(k => J((x.steps || {})[k]) !== J(y.steps[k])), e = ((y.steps || {})[ch]) || {}, e0 = ((x.steps || {})[ch]) || {};
    return e.deleted && !e0.deleted ? 'delete a step' : !!e.pinned !== !!e0.pinned ? (e.pinned ? 'pin a step' : 'unpin a step') : 'edit a step';
  }
  if (added(a.unfolded, b.unfolded).length) return `show folded files in ${label(added(a.unfolded, b.unfolded)[0])}`;
  if (removed(a.unfolded, b.unfolded).length) return `fold ${label(removed(a.unfolded, b.unfolded)[0])} again`;
  if (added(a.collapsed, b.collapsed).length) return `collapse ${label(added(a.collapsed, b.collapsed)[0])}`;
  if (removed(a.collapsed, b.collapsed).length) return `expand ${label(removed(a.collapsed, b.collapsed)[0])}`;
  if (added(a.isoOpen, b.isoOpen).length) return `open ${portName(added(a.isoOpen, b.isoOpen)[0])} port`;
  if (removed(a.isoOpen, b.isoOpen).length) return `close ${portName(removed(a.isoOpen, b.isoOpen)[0])} port`;
  if (a.stage !== b.stage) return `stage ${b.stage}`;
  if (a.view !== b.view) return `switch to ${b.view}`;
  if (JSON.stringify(a.offsets) !== JSON.stringify(b.offsets)) return 'move a section';
  if (JSON.stringify(a.diff) !== JSON.stringify(b.diff)) return b.diff ? `re-run diff, ${b.diff.side}` : 'hide re-run diff';
  if (JSON.stringify(a.selection) !== JSON.stringify(b.selection)) return b.selection && b.selection.id ? `select ${label(b.selection.id)}` : 'clear selection';
  if (JSON.stringify(a.dimmedKinds) !== JSON.stringify(b.dimmedKinds)) return 'dim or show an edge kind';
  if (JSON.stringify(a.settings) !== JSON.stringify(b.settings)) return 'hub placement';
  return 'tour step';
}
const H = createHistory(store, describe);
const mac = /Mac|iPhone|iPad/.test(navigator.platform);

// ---------- render loop
let map = null, pending = false;
const cardHeights = {}; // story id -> {step id: measured px}; layout input only, never state
let lastSize = '';
function paint() {
  pending = false;
  if (!canvas.clientWidth || !canvas.clientHeight) return;
  lastSize = canvas.clientWidth + 'x' + canvas.clientHeight;
  const s = store.get();

addEventListener('keydown', e => {
  // Text fields keep their own undo and arrows; only Escape (blur) is ours there.
  if (e.target.closest && e.target.closest('input, textarea')) { if (e.key === 'Escape') e.target.blur(); return; }
  const mod = mac ? e.metaKey : e.ctrlKey, k = e.key.toLowerCase();
  if (mod && k === 'z') { e.preventDefault(); return e.shiftKey ? H.forward() : H.back(); }
  if (!mac && e.ctrlKey && k === 'y') { e.preventDefault(); return H.forward(); }
  if ((e.altKey || e.metaKey) && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { e.preventDefault(); return e.key === 'ArrowLeft' ? H.back() : H.forward(); }
  // Safari has no native side-button navigation; mouse drivers send ⌘[ and ⌘] instead.
  if (e.metaKey && (e.key === '[' || e.key === ']')) { e.preventDefault(); return e.key === '[' ? H.back() : H.forward(); }
  if (e.key === 'Tab' && menuOpen()) return closeMenu();
  if (e.key !== 'Escape') return;

function claimsFor(id) {

  crumbs(home).forEach(s => out.push(s));
  data.order.forEach(eid => {
    const el = data.elements[eid];
    if (out.includes(eid)) return;
    const p = el.primitive;
    if ((p === 'set' || p === 'overlap') && el.members.includes(id)) out.push(eid);
    if (p === 'lane' && el.steps.includes(id)) out.push(eid);
    if (p === 'hub' && el.node === id) out.push(eid);
    if (p === 'loop' && el.cycle.includes(id)) out.push(eid);
    if (p === 'twins' && crumbs(home).some(s => el.members.includes(s))) out.push(eid);
    if (p === 'band' && el.levels.some(l => l.members.includes(data.topOf(home)))) out.push(eid);

  return `<span class="eyebrow">Outside the ${esc(lz.label)} lens</span><h2>${files.length} files · ${lz.counts.crossing} crossing edges</h2>
    <p>Not deleted: these files and the ${lz.counts.outsideEdges} edges among them are folded into one box. Every edge that crosses into the lens is listed below and drawn onto the box with a count.</p>
    <div><span class="eyebrow">Crossing edges · ${cross.length}</span>${cross.map(e => go('edge', e.id, `${swatch(e)}<span class="m">${lz.inside.has(e.src) ? '→' : '←'}</span><span class="n mono">${esc(label(lz.inside.has(e.src) ? e.dst : e.src))}</span><span class="m">${esc(label(lz.inside.has(e.src) ? e.src : e.dst))}</span>`, 'erow')).join('')}</div>
    ${roles.map(r => `<div><span class="eyebrow">${esc(r)} · ${byRole[r].length}</span>${byRole[r].map(f => go('node', f, `<span></span><span></span><span class="n mono">${p(f)}</span><span class="m"></span>`, 'erow')).join('')}</div>`).join('')}`;
}

// ---------- "How it works" panels and actions (ADR 0025)
const splitKey = key => [key.slice(0, key.lastIndexOf(':')), key.slice(key.lastIndexOf(':') + 1)];
function storyAction(type, arg) {
  const s = store.get(), st = curStory(s); if (!st) return;
  const [storyId, stepId] = arg.includes(':') && type !== 'st-pick' ? splitKey(arg) : [st.id, arg];
  const val = sel => { const el = pb.querySelector(sel); return el ? el.value : ''; };
  if (type === 'st-pick') return A.setStory(arg);
  if (type === 'st-save') {
    // Only a real change marks the step as yours (annotated); saving unchanged text leaves it the agent's.
    const src = (st.steps.find(x => x.id === stepId) || ((((s.storyEdits || {})[storyId] || {}).added || []).find(a => a.id === stepId)) || {});
    const label = val('#stLabel').trim(), does = val('#stDoes').trim();
    const cur = (effStory(s).steps.find(x => x.id === stepId) || {});
    if (label === cur.label && does === (cur.does || '')) return; // no change, no history step
    return A.editStory(storyId, ed => { ed.steps = ed.steps || {}; const e = ed.steps[stepId] = { ...(ed.steps[stepId] || {}) };
      if (label && label !== src.label) e.label = label; else delete e.label;
      if (does !== (src.does || '')) e.does = does; else delete e.does;
      const add = (ed.added || []).find(a => a.id === stepId); if (add) { add.label = label || add.label; add.does = does; delete e.label; delete e.does; }
      return ed; });
  }
  if (type === 'st-pin') return A.editStory(storyId, ed => { ed.steps = ed.steps || {}; const e = ed.steps[stepId] = ed.steps[stepId] || {}; e.pinned = !e.pinned; return ed; });
  if (type === 'st-del') { A.editStory(storyId, ed => { ed.steps = ed.steps || {}; ed.steps[stepId] = { ...(ed.steps[stepId] || {}), deleted: true }; return ed; }); return A.clear(); }
  if (type === 'st-add') {
    const n = 1 + Math.max(0, ...(((s.storyEdits || {})[storyId] || {}).added || []).map(a => +a.id.slice(1)));
    A.editStory(storyId, ed => { (ed.added = ed.added || []).push({ id: 'u' + n, after: stepId, label: 'New step', does: '', files: [] }); return ed; });
    return store.set({ selection: { type: 'step', id: storyId + ':u' + n } });
  }
  if (type === 'st-ask') { const text = val('#stAsk').trim(); if (text) A.editStory(storyId, ed => { (ed.requests = ed.requests || []).push({ step: stepId === '-' ? null : stepId, text }); return ed; }); return; }
  if (type === 'st-reset') return A.editStory(storyId, () => ({}));
  if (type === 'st-copy') {
    const txt = JSON.stringify({ story: storyId, stories: STORY_PATH, edits: (s.storyEdits || {})[storyId] || {} }, null, 2);
    const done = ok => { const b = pb.querySelector('[data-type="st-copy"]'); if (b) b.textContent = ok ? 'Copied' : 'Select the text below and copy it'; if (!ok) { const pre = pb.querySelector('#stExport'); if (pre) { pre.hidden = false; pre.textContent = txt; } } };
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => done(true), () => done(false)); else done(false);
  }
}
function stepPanel(key) {
  const s = store.get(), st = effStory(s); if (!st) return '';
  const [storyId, stepId] = splitKey(key), step = st.steps.find(x => x.id === stepId); if (!step) return '<p>This step no longer exists.</p>';
  const acc = storyAccounting(data, st), lk = st.links.map((l, i) => ({ ...l, i })).filter(l => l.from === stepId || l.to === stepId);
  const name = id => esc((st.steps.find(x => x.id === id) || {}).label || id);
  const reqs = (((s.storyEdits || {})[storyId] || {}).requests || []).filter(r => r.step === stepId);
  return `<div class="row"><span class="eyebrow">Step · ${esc(step.concept)}</span><span>${chip(step.pinned ? 'pinned' : step.provenance, step.pinned ? 'state-ok' : step.provenance === 'annotated' ? 'ink' : 'ink-faint')}</span></div>
    <h2>${esc(step.label)}</h2><p>${esc(step.does) || 'No description yet.'}</p>
    <p class="path">${step.provenance === 'annotated' ? 'Edited by you. The agent keeps your version when it redraws.' : 'Written by the Structure agent from the code (inferred). Edit it, pin it, or ask for a redraw.'}</p>
    <div class="list"><span class="eyebrow">Edit</span>
      <input id="stLabel" class="fld" value="${esc(step.label)}" aria-label="Step name">
      <textarea id="stDoes" class="fld" rows="3" aria-label="What this step does">${esc(step.does)}</textarea>
      <div class="row" style="justify-content:flex-start;gap:8px">${go('st-save', key, 'Save', 'btn primary')}${go('st-pin', key, step.pinned ? 'Unpin' : 'Pin as truth', 'btn')}${go('st-add', key, 'Add step after', 'btn')}${go('st-del', key, 'Delete', 'btn')}</div></div>
    ${step.files.length ? `<div><span class="eyebrow">Files that do it · ${step.files.length}</span>${step.files.map(f => go('node', f, `<span></span><span></span><span class="n mono">${esc(data.nodes[f] ? data.nodes[f].path : f + ' (not in graph)')}</span><span class="m"></span>`, 'erow')).join('')}</div>` : '<p class="path">No files yet: add them by asking the agent, or this step stays a gap.</p>'}
    ${(step.evidence || []).length ? `<div class="list"><span class="eyebrow">Evidence</span>${step.evidence.map(e => `<div class="card"><span class="t mono">${esc(e.path)}:${Number(e.line) || '?'}</span>${e.note ? `<span class="s">${esc(e.note)}</span>` : ''}</div>`).join('')}</div>` : ''}
    ${lk.length ? `<div><span class="eyebrow">Links</span>${lk.map(l => `<div class="erow"><span class="m">${l.from === stepId ? '→' : '←'}</span><span></span><span class="n">${name(l.from === stepId ? l.to : l.from)}</span><span class="m">${esc(l.carries)} · ${acc.support[l.i] ? acc.support[l.i] + ' crawled' : 'inferred only'}</span></div>`).join('')}</div>` : ''}
    <div class="list"><span class="eyebrow">Ask the agent to redraw</span>
      <textarea id="stAsk" class="fld" rows="2" placeholder="e.g. split voice allocation out of this step"></textarea>
      <div class="row" style="justify-content:flex-start">${go('st-ask', key, 'Add request', 'btn')}</div>
      ${reqs.map(r => `<div class="card"><span class="s">${esc(r.text)}</span><span class="m">waiting for the Structure agent</span></div>`).join('')}</div>`;
}
function storyOutPanel(s) {
  const st = effStory(s); if (!st) return '';
  const acc = storyAccounting(data, st), out = data.nodeIds.filter(id => !acc.inside.has(id));
  const byRole = {}; out.forEach(id => { const r = data.nodes[id].role || 'other'; (byRole[r] = byRole[r] || []).push(id); });
  const cross = acc.crossing.map(id => data.edgeById[id]).filter(Boolean);
  return `<span class="eyebrow">Not in “${esc(st.title)}”</span><h2>${out.length} files · ${acc.counts.crossing} crossing edges</h2>
    <p>Counted, not deleted. These files and the ${acc.counts.outsideEdges} edges among them sit behind the box; every edge crossing into the story is listed.</p>
    <div><span class="eyebrow">Crossing edges · ${cross.length}</span>${cross.map(e => go('edge', e.id, `${swatch(e)}<span class="m">${acc.inside.has(e.src) ? '→' : '←'}</span><span class="n mono">${esc(label(acc.inside.has(e.src) ? e.dst : e.src))}</span><span class="m">${esc(label(acc.inside.has(e.src) ? e.src : e.dst))}</span>`, 'erow')).join('')}</div>
    ${Object.keys(byRole).sort((a, b) => byRole[b].length - byRole[a].length || (a < b ? -1 : 1)).map(r => `<div><span class="eyebrow">${esc(r)} · ${byRole[r].length}</span>${byRole[r].map(f => go('node', f, `<span></span><span></span><span class="n mono">${esc(data.nodes[f].path)}</span><span class="m"></span>`, 'erow')).join('')}</div>`).join('')}`;
}
function worksStagePanel(s) {
  const st = effStory(s);
  if (!st) return `<span class="eyebrow">How it works</span><h2>No stories for this snapshot</h2><p>Stories are written by the Structure agent for a crawled commit. This snapshot has none yet.</p>`;
  const ed = (s.storyEdits || {})[st.id] || {}, reqs = ed.requests || [], acc = storyAccounting(data, st);
  const nEdited = st.steps.filter(x => x.provenance === 'annotated').length, nPinned = st.steps.filter(x => x.pinned).length;
  return `<span class="eyebrow">How it works · ${STORIES.length} stor${STORIES.length === 1 ? 'y' : 'ies'}</span><h2>${esc(st.title)}</h2><p>${esc(st.question)}</p>
    <p class="path">Inferred by the Structure agent from the code; every step cites file and line. ${nEdited} edited by you, ${nPinned} pinned. Every link is a claim and is drawn dashed; ${st.links.filter((l, i) => !acc.support[i]).length} of ${st.links.length} have no crawled edge between their steps' files and state their reason instead.</p>
    <div class="list">${st.steps.map(x => go('step', st.id + ':' + x.id, `<div class="row"><span class="t">${esc(x.label)}</span>${chip(x.pinned ? 'pinned' : x.provenance, x.pinned ? 'state-ok' : 'ink-faint')}</div><span class="s">${esc(x.does)}</span>`, 'card')).join('')}</div>
    ${(() => { const known = new Set(curStory(s).steps.map(x => x.id).concat((ed.added || []).map(a => a.id))); const orph = Object.keys(ed.steps || {}).filter(k => !known.has(k)).length + st.steps.filter(x => x.orphan).length;
      return orph ? `<div class="card"><span class="t">${orph} edit${orph > 1 ? 's' : ''} no longer match a step</span><span class="s">The stories were rewritten since you made them. Orphaned added steps are shown at the end; other orphaned edits are kept but not applied.</span></div>` : ''; })()}
    <div><span class="eyebrow">Edges among the story's files · ${acc.counts.insideEdges}</span>${data.edges.filter(e => acc.inside.has(e.src) && acc.inside.has(e.dst)).map(e => go('edge', e.id, `${swatch(e)}<span></span><span class="n mono">${esc(label(e.src))} → ${esc(label(e.dst))}</span><span class="m">${esc(e.kind)}</span>`, 'erow')).join('')}</div>
    <div class="list"><span class="eyebrow">Requests for the agent · ${reqs.length}</span>${reqs.map(r => `<div class="card"><span class="s">${esc(r.text)}</span><span class="m">${r.step ? 'on ' + esc((st.steps.find(x => x.id === r.step) || {}).label || r.step) : 'whole story'}</span></div>`).join('') || '<p class="path">None. Add one from any step, or below for the whole story.</p>'}
      <textarea id="stAsk" class="fld" rows="2" placeholder="e.g. add a story for loading a preset"></textarea>
      <div class="row" style="justify-content:flex-start;gap:8px">${go('st-ask', st.id + ':-', 'Add request', 'btn')}${go('st-copy', st.id + ':-', 'Copy edits', 'btn')}${go('st-reset', st.id + ':-', 'Reset my edits', 'btn')}</div>
      <pre id="stExport" class="path" hidden></pre></div>`;
}

function unaccountedPanel(c) {
  return `<span class="eyebrow">Conservation</span><h2>${c.unaccounted.length} not accounted for</h2><p>These ids are neither drawn, in a bus, folded nor inside a collapsed group.</p><div>${c.unaccounted.map(id => `<div class="erow"><span></span><span></span><span class="n path">${esc(id)}</span><span></span></div>`).join('')}</div>`;
}

let lastTourNode = null;
function panel(s, c) {
  // tour step drives the selection highlight
  if (s.stage === 6 && data.stages && !s.selection) {
    const t = data.stages.tours[s.tour.index], node = t && t.steps[Math.min(s.tour.step, t.steps.length - 1)].node;
    if (node !== lastTourNode) { lastTourNode = node; }
  }
  const sel = s.selection;
  let html = '', title = '';
  if (sel && sel.type === 'node') { html = nodePanel(sel.id); title = label(sel.id); }
  else if (sel && sel.type === 'element') { html = elementPanel(sel.id); title = label(sel.id); }
  else if (sel && sel.type === 'edge') { html = edgePanel(sel.id); title = 'Edge'; }
  else if (sel && sel.type === 'unaccounted') { html = unaccountedPanel(c); title = 'Conservation'; }
  else if (sel && sel.type === 'lensout') { html = lensPanel(); title = 'Outside the lens'; }
  else if (sel && sel.type === 'step') { html = stepPanel(sel.id); title = 'Step'; }
  else if (sel && sel.type === 'storyout') { html = storyOutPanel(s); title = 'Not in this story'; }
  if (!html) { html = stagePanel(s, c); title = s.diff ? 'Re-run diff' : `Stage ${s.stage} · ${STAGES[s.stage - 1].label}`; }
  else html = `<div class="row"><span></span><button class="path" data-type="clear" data-go="x" style="color:${v('ink-muted')}">Back to stage</button></div>` + html;
  const noPos = Object.fromEntries(Object.entries(s.storyEdits || {}).map(([k, e]) => [k, { ...e, pos: undefined }]));
  const key = JSON.stringify([sel, s.stage, s.tour, s.diff, s.collapsed, s.settings, s.unfolded, s.isolate, s.lens, s.view, s.story, noPos]);
  if (pb.dataset.key !== key) { pb.innerHTML = html; pb.dataset.key = key; pb.scrollTop = 0; }
  $('handleText').textContent = title;
}
pb.addEventListener('click', e => { const b = e.target.closest('[data-type="clear"]'); if (b) { e.stopPropagation(); A.clear(); } }, true);

window.loupe = { store, data, render: () => paint(), get map() { return map; } };
paint();
</script>
