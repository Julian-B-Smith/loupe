<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loupe</title>
<link rel="stylesheet" href="../tokens.css">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--loupe-surface-page);color:var(--loupe-ink);font:var(--loupe-type-panel-body)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--loupe-focus-ring);outline-offset:2px;border-radius:4px}
a{color:var(--loupe-accent)}a:hover{color:var(--loupe-ink)}
.mono{font:var(--loupe-type-node-label);letter-spacing:var(--loupe-tracking-node-label)}
.eyebrow{font:var(--loupe-type-eyebrow);letter-spacing:var(--loupe-tracking-eyebrow);text-transform:uppercase;color:var(--loupe-ink-faint)}
.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px 18px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--loupe-rule)}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand b{font:700 19px/24px var(--loupe-font-ui);letter-spacing:-.02em}
.brand span{font:var(--loupe-type-count);color:var(--loupe-ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.meter{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;text-align:left}
.meter i{width:9px;height:9px;border-radius:50%;flex:none}
.meter b{font:500 13px/16px var(--loupe-font-ui)}
.meter small{font:var(--loupe-type-count);color:var(--loupe-ink-faint)}
.seg{display:flex;padding:2px;gap:2px;border-radius:7px;background:var(--loupe-surface-group-nested)}
.seg button{padding:4px 10px;border-radius:5px;font:500 12.5px/16px var(--loupe-font-ui);color:var(--loupe-ink-muted)}
.seg button:disabled{opacity:.35;cursor:default}
.seg button[aria-pressed="true"]{background:var(--loupe-surface-node);color:var(--loupe-ink);box-shadow:0 0 0 1px var(--loupe-rule)}
.seg .lbl{padding:4px 6px 4px 8px;font:var(--loupe-type-caption);color:var(--loupe-ink-faint);align-self:center}
.stages{display:flex;gap:2px;padding:6px 12px;border-bottom:1px solid var(--loupe-rule);overflow-x:auto;scrollbar-width:none}
.stages::-webkit-scrollbar{display:none}
.stg{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:6px;white-space:nowrap;font:500 13px/16px var(--loupe-font-ui);color:var(--loupe-ink-muted)}
.stg i{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;font:var(--loupe-type-count);font-style:normal;border:1px solid var(--loupe-rule);color:var(--loupe-ink-faint)}
.stg:hover{background:var(--loupe-surface-group-nested)}
.stg[aria-current="step"]{background:var(--loupe-surface-group);color:var(--loupe-ink)}
.stg[aria-current="step"] i{background:var(--loupe-ink);border-color:var(--loupe-ink);color:var(--loupe-surface-node)}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
.canvas{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--loupe-surface-canvas);touch-action:none;cursor:grab}
.canvas.dragging{cursor:grabbing}
.canvas.can-move{cursor:move}
.canvas.moving{cursor:move}
.float{position:absolute;display:flex;gap:6px;background:var(--loupe-surface-panel);border-radius:var(--loupe-radius-panel);box-shadow:0 0 0 1px var(--loupe-rule)}
.legend{left:12px;bottom:12px;padding:10px 12px;gap:14px;flex-wrap:wrap;max-width:calc(100% - 96px)}
.legend .col{display:grid;gap:3px;align-content:start}
.legend .col+.col{padding-left:14px;border-left:1px solid var(--loupe-rule)}
.lk{display:flex;align-items:center;gap:7px;font:var(--loupe-type-caption);color:var(--loupe-ink-muted);text-align:left}
.lk[aria-pressed="false"]{opacity:.35}
.legend.closed .col{display:none}
.legend .kt{font:var(--loupe-type-eyebrow);letter-spacing:var(--loupe-tracking-eyebrow);text-transform:uppercase;color:var(--loupe-ink-faint);align-self:flex-start}
.legend.closed{padding:6px 10px}
.zoom{right:12px;bottom:12px;flex-direction:column;gap:0;overflow:hidden}
.zoom button{width:36px;height:34px;font:500 16px/1 var(--loupe-font-ui);color:var(--loupe-ink-muted)}
.zoom button+button{border-top:1px solid var(--loupe-rule)}
.zoom .lod{font:var(--loupe-type-count);padding:6px 0;text-align:center;color:var(--loupe-ink-faint);border-top:1px solid var(--loupe-rule);width:36px;white-space:nowrap}
.settings{right:12px;top:12px;padding:3px}
.iso{left:12px;top:12px;padding:6px 8px 6px 12px;align-items:center;gap:10px}
.iso[hidden]{display:none}
.ctx{position:absolute;z-index:10;min-width:230px;max-width:320px;max-height:calc(100% - 8px);overflow-y:auto;padding:4px;background:var(--loupe-surface-panel);border-radius:var(--loupe-radius-panel);box-shadow:0 0 0 1px var(--loupe-rule),0 8px 24px rgb(0 0 0 / .18);display:flex;flex-direction:column}
.ctx button{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 10px;border-radius:6px;text-align:left;font:500 13px/16px var(--loupe-font-ui)}
.ctx button:hover:not(:disabled),.ctx button:focus-visible{background:var(--loupe-surface-group-nested);outline:none}
.ctx button:disabled{opacity:.4;cursor:default}
.ctx .l{display:flex;flex-direction:column;min-width:0}
.ctx small{font:var(--loupe-type-caption);color:var(--loupe-ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx kbd{font:var(--loupe-type-count);color:var(--loupe-ink-faint)}
.ctx .sep{height:1px;margin:4px 6px;background:var(--loupe-rule)}
.iso b{font:600 13px/16px var(--loupe-font-ui)}
.panel{border-left:1px solid var(--loupe-rule);background:var(--loupe-surface-panel);min-height:0;display:flex;flex-direction:column}
.handle{display:none}
.pbody{overflow-y:auto;padding:18px 20px 28px;display:flex;flex-direction:column;gap:14px;min-height:0;flex:1}
.pbody h2{margin:0;font:var(--loupe-type-panel-title);letter-spacing:-.015em;overflow-wrap:anywhere;text-wrap:balance}
.pbody p{margin:0;color:var(--loupe-ink-muted);text-wrap:pretty}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.path{font:var(--loupe-type-count);color:var(--loupe-ink-faint);overflow-wrap:anywhere}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;font:var(--loupe-type-caption);color:var(--loupe-ink-faint)}
.crumbs button{color:var(--loupe-accent)}
.list{display:flex;flex-direction:column;gap:6px}
.card{display:flex;flex-direction:column;gap:5px;padding:10px 12px;border-radius:8px;background:var(--loupe-surface-group);box-shadow:inset 0 0 0 1px var(--loupe-rule);text-align:left;width:100%}
button.card:hover{box-shadow:inset 0 0 0 1px var(--loupe-ink-faint)}
.card.on{box-shadow:inset 0 0 0 2px var(--loupe-accent)}
.card .t{font:500 13px/17px var(--loupe-font-ui)}
.card .s{font:var(--loupe-type-caption);color:var(--loupe-ink-muted);text-wrap:pretty}
.card .m{font:var(--loupe-type-count);color:var(--loupe-ink-faint)}
.chip{font:var(--loupe-type-eyebrow);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.erow{display:grid;grid-template-columns:30px 14px minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px solid var(--loupe-rule);text-align:left;width:100%}
.erow:hover{background:var(--loupe-surface-group)}
.erow .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.erow .m{font:var(--loupe-type-caption);color:var(--loupe-ink-faint);white-space:nowrap}
.btn{padding:6px 12px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--loupe-rule);font:500 13px/16px var(--loupe-font-ui)}
.btn.primary{background:var(--loupe-ink);color:var(--loupe-surface-node);box-shadow:none}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font:var(--loupe-type-caption)}
.kv dt{color:var(--loupe-ink-faint)}.kv dd{margin:0;color:var(--loupe-ink);overflow-wrap:anywhere}
table.t{border-collapse:collapse;width:100%;font:var(--loupe-type-caption);font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:5px 4px;border-bottom:1px solid var(--loupe-rule);text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--loupe-ink-faint);font-weight:500}
.err{padding:24px;color:var(--loupe-state-bad)}
@media (max-width:720px){
  .top{padding:8px 12px}.brand span{display:none}
  main{grid-template-columns:minmax(0,1fr)}
  .settings{top:8px;right:8px}
  .panel{position:fixed;left:0;right:0;bottom:0;height:62vh;border-left:0;border-top:1px solid var(--loupe-rule);border-radius:14px 14px 0 0;transform:translateY(calc(100% - 76px));transition:transform .25s cubic-bezier(.2,.7,.2,1);z-index:5}
  .panel.open{transform:none}
  .handle{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 16px 4px;width:100%}
  .handle::before{content:"";width:36px;height:4px;border-radius:2px;background:var(--loupe-rule)}
  .handle span{font:500 13px/16px var(--loupe-font-ui);align-self:stretch;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pbody{padding-top:6px}
  .zoom{bottom:88px}
}
@media (prefers-reduced-motion: reduce){.panel{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><b>Loupe</b><span id="repo"></span></div>
    <div class="tools">
      <button class="meter" id="meter" title="Conservation check"></button>
      <div class="seg" id="histSeg"><button id="hBack" aria-label="Back">←</button><button id="hFwd" aria-label="Forward">→</button></div>
      <div class="seg" id="viewSeg"><button data-view="flow">Flow</button><button data-view="design">Design</button></div>
      <div class="seg" id="diffSeg"><span class="lbl">Re-run</span><button data-diff="off">Off</button><button data-diff="before">Before</button><button data-diff="after">After</button></div>
      <div class="seg"><button id="theme">Dark</button></div>
    </div>
  </header>
  <nav class="stages" id="stages" aria-label="Pipeline stages"></nav>
  <main>
    <section class="canvas" id="canvas" aria-label="Map">
      <div class="float settings" style="gap:6px;background:none;box-shadow:none"><div class="seg" id="hubSeg" title="Hub placement" style="box-shadow:0 0 0 1px var(--loupe-rule)"><span class="lbl">Hubs</span><button data-hub="group">With group</button><button data-hub="center">Centered</button></div><div class="seg" id="resetSeg" style="box-shadow:0 0 0 1px var(--loupe-rule)" hidden><button id="resetLayout" title="Put moved sections and levels back">Reset layout</button></div></div>
      <div class="float iso" id="isoBar" hidden><span class="eyebrow">Isolated</span><b id="isoName"></b><span class="eyebrow" id="isoElse" style="text-transform:none;letter-spacing:0"></span><button class="btn" id="isoExit">Back to full map</button></div>
      <div class="float legend" id="legend"></div>
      <div class="float zoom"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">−</button><button id="zfit" title="Fit" style="font:var(--loupe-type-count)">fit</button><div class="lod" id="lod"></div></div>
    </section>
    <aside class="panel" id="panel"><button class="handle" id="handle"><span id="handleText"></span></button><div class="pbody" id="pbody"></div></aside>
  </main>
</div>
<script type="module">
import { loadSnapshot } from './snapshot.js';
import { createStore, createHistory, STAGES } from './state.js';
import { render, SPEC, slotOf, glyphOf } from './render.js';
import { conserve, conformity } from './standins.js';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const v = n => `var(--loupe-${n})`;
const params = new URLSearchParams(location.search);
const SNAP = params.get('snapshot') || 'snapshots/horde-sample/';
const canvas = $('canvas');
const phone = () => matchMedia('(max-width:720px)').matches;

let data;
try { data = await loadSnapshot(SNAP); }
catch (err) { canvas.innerHTML = `<div class="err">${esc(err.message)}</div>`; throw err; }

const saved = JSON.parse(localStorage.getItem('loupe-proto') || '{}');
const savedOffsets = (saved.offsets || {})[SNAP] || {};
const store = createStore({ stage: saved.stage || 2, view: STAGES[(saved.stage || 2) - 1].view, theme: saved.theme || 'light', offsets: savedOffsets });
const A = store.actions;
const PRIM = { section: 'Section', set: 'Set', overlap: 'Overlap', bus: 'Bus', band: 'Band', lane: 'Lane', twins: 'Twins', hub: 'Hub', loop: 'Loop' };
const STATUS = { confirmed: 'state-ok', challenged: 'state-bad', proposed: 'ink-faint', open: 'state-warn', pending: 'state-warn', established: 'ink-muted', answered: 'state-ok' };
const chip = (text, tok) => `<span class="chip" style="color:${v(tok || STATUS[text] || 'ink-faint')}">${esc(text)}</span>`;
const label = id => (data.nodes[id] && data.nodes[id].label) || (data.elements[id] && (data.elements[id].label || id)) || id;
const crumbs = sec => { const out = []; while (sec) { out.unshift(sec); sec = data.parentOf[sec]; } return out; };
const swatch = e => {
  const s = slotOf(e), g = glyphOf(e), c = v('edge-' + s), d = SPEC.dash[e.provenance] || 'none', cap = SPEC.cap[e.provenance] || 'butt';
  const head = g === 'dot' ? `<circle cx="24" cy="5" r="2.8" style="fill:${c}"/>` : `<path d="M19 1.4L27 5L19 8.6z" style="fill:${g === 'arrow-hollow' ? v('surface-panel') : c};stroke:${c};stroke-width:${g === 'arrow-hollow' ? 1.2 : 0}px"/>`;
  return `<svg width="30" height="10" aria-hidden="true"><line x1="1" y1="5" x2="${g === 'dot' ? 21 : 20}" y2="5" style="stroke:${c};stroke-width:1.5px;stroke-dasharray:${d};stroke-linecap:${cap}"/>${head}</svg>`;
};

// ---------- history (ADR 0024): Back/Forward = Undo/Redo. Labels name the step a Back would undo.
const portName = k => { const id = k.split(/:(?:s|all|f):/)[1] || k; return label(id); };
function describe(a, b) {
  const added = (x, y) => (y || []).filter(i => !(x || []).includes(i)), removed = (x, y) => (x || []).filter(i => !(y || []).includes(i));
  if (a.isolate !== b.isolate) return b.isolate ? `isolate ${label(b.isolate)}` : `back to full map from ${label(a.isolate)}`;
  if (added(a.unfolded, b.unfolded).length) return `show folded files in ${label(added(a.unfolded, b.unfolded)[0])}`;
  if (removed(a.unfolded, b.unfolded).length) return `fold ${label(removed(a.unfolded, b.unfolded)[0])} again`;
  if (added(a.collapsed, b.collapsed).length) return `collapse ${label(added(a.collapsed, b.collapsed)[0])}`;
  if (removed(a.collapsed, b.collapsed).length) return `expand ${label(removed(a.collapsed, b.collapsed)[0])}`;
  if (added(a.isoOpen, b.isoOpen).length) return `open ${portName(added(a.isoOpen, b.isoOpen)[0])} port`;
  if (removed(a.isoOpen, b.isoOpen).length) return `close ${portName(removed(a.isoOpen, b.isoOpen)[0])} port`;
  if (a.stage !== b.stage) return `stage ${b.stage}`;
  if (a.view !== b.view) return `switch to ${b.view}`;
  if (JSON.stringify(a.offsets) !== JSON.stringify(b.offsets)) return 'move a section';
  if (JSON.stringify(a.diff) !== JSON.stringify(b.diff)) return b.diff ? `re-run diff, ${b.diff.side}` : 'hide re-run diff';
  if (JSON.stringify(a.selection) !== JSON.stringify(b.selection)) return b.selection && b.selection.id ? `select ${label(b.selection.id)}` : 'clear selection';
  if (JSON.stringify(a.dimmedKinds) !== JSON.stringify(b.dimmedKinds)) return 'dim or show an edge kind';
  if (JSON.stringify(a.settings) !== JSON.stringify(b.settings)) return 'hub placement';
  return 'tour step';
}
const H = createHistory(store, describe);
const mac = /Mac|iPhone|iPad/.test(navigator.platform);

// ---------- render loop
let map = null, pending = false;
let lastSize = '';
function paint() {
  pending = false;
  if (!canvas.clientWidth || !canvas.clientHeight) return;
  lastSize = canvas.clientWidth + 'x' + canvas.clientHeight;
  const s = store.get();
  document.documentElement.dataset.theme = s.theme;
  const st = { ...s, zoom: { ...s.zoom, padBottom: phone() ? 76 : 96 } };
  map = render(canvas, data, st);
  const c = conserve(data, s, map);
  meter(c);
  $('lod').textContent = { overview: 'ovw', structure: 'str', detail: 'det' }[map.lod]; $('lod').title = 'Level of detail: ' + map.lod;
  chrome(s);
  panel(s, c);
}
const schedule = () => { if (!pending) { pending = true; setTimeout(paint, 0); } };
store.on(schedule);
new ResizeObserver(schedule).observe(canvas);
// Hidden or throttled frames may never deliver resize or animation callbacks: poll until sized, then on size change.
const sizeChanged = () => (canvas.clientWidth + 'x' + canvas.clientHeight) !== lastSize;
let polls = 0;
const poll = () => { if (sizeChanged()) paint(); if (++polls < 30) setTimeout(poll, 100); };
setTimeout(poll, 0);
addEventListener('resize', () => { if (sizeChanged()) schedule(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) paint(); });
if (document.fonts) document.fonts.ready.then(schedule);

// ---------- flow-to-design transition
let lastView = store.get().view, anim = null;
store.on(s => {
  if (s.view === lastView) return;
  lastView = s.view;
  const from = s.morph != null ? s.morph : s.view === 'design' ? 0 : 1, to = s.view === 'design' ? 1 : 0;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (anim) clearTimeout(anim);
  const total = reduce ? 150 : SPEC.motion.maxTotal, t0 = performance.now();
  const step = () => {
    const p = Math.min(1, (performance.now() - t0) / total);
    const m = reduce ? (p < 0.5 ? from : to) : from + (to - from) * p;
    if (p >= 1) { anim = null; store.set({ morph: undefined }); return; }
    store.set({ morph: m }); anim = setTimeout(step, 16);
  };
  step();
});

// ---------- chrome
$('stages').innerHTML = STAGES.map(st => `<button class="stg" data-stage="${st.n}"><i>${st.n}</i>${st.label}</button>`).join('');
$('stages').onclick = e => { const b = e.target.closest('[data-stage]'); if (b) A.setStage(+b.dataset.stage); };
$('viewSeg').onclick = e => { const b = e.target.closest('[data-view]'); if (b) A.setView(b.dataset.view); };
$('diffSeg').onclick = e => { const b = e.target.closest('[data-diff]'); if (b) A.setDiff(b.dataset.diff === 'off' ? null : { side: b.dataset.diff }); };
$('hubSeg').onclick = e => { const b = e.target.closest('[data-hub]'); if (b) A.setHubPlacement(b.dataset.hub); };
$('theme').onclick = () => A.setTheme(store.get().theme === 'dark' ? 'light' : 'dark');
$('handle').onclick = () => $('panel').classList.toggle('open');
$('repo').textContent = `${data.graph.source && data.graph.source.repo || 'HORDE sample'} · ${data.view.dialect.name} · not crawled`;
if (!data.diff) $('diffSeg').hidden = true;
if (!(data.byPrimitive.hub || []).length) $('hubSeg').hidden = true;
store.on(s => { const prev = JSON.parse(localStorage.getItem('loupe-proto') || '{}'); localStorage.setItem('loupe-proto', JSON.stringify({ stage: s.stage, theme: s.theme, offsets: { ...(prev.offsets || {}), [SNAP]: s.offsets } })); });
$('resetLayout').onclick = () => A.resetLayout();
$('isoExit').onclick = () => A.isolate(null);
$('hBack').onclick = () => H.back(); $('hFwd').onclick = () => H.forward();
H.on(() => { closeMenu(); chrome(store.get()); });

function chrome(s) {
  document.querySelectorAll('[data-stage]').forEach(b => b.setAttribute('aria-current', +b.dataset.stage === s.stage ? 'step' : 'false'));
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === s.view));
  document.querySelectorAll('[data-diff]').forEach(b => b.setAttribute('aria-pressed', (s.diff ? s.diff.side : 'off') === b.dataset.diff));
  const hp = s.settings.hubPlacement || data.settings.hubPlacement || 'group';
  document.querySelectorAll('[data-hub]').forEach(b => b.setAttribute('aria-pressed', b.dataset.hub === hp));
  $('hubSeg').style.display = s.view === 'design' && !s.isolate ? '' : 'none'; // hub placement needs the band, which isolate drops
  $('resetSeg').hidden = !(s.view === 'design' && !s.isolate && Object.values(s.offsets || {}).some(o => o && (o.dx || o.dy)));
  $('theme').textContent = s.theme === 'dark' ? 'Light' : 'Dark';
  const kb = mac ? '⌘Z' : 'Ctrl+Z', kf = mac ? '⇧⌘Z' : 'Ctrl+Y';
  $('hBack').disabled = !H.canBack; $('hFwd').disabled = !H.canForward;
  $('hBack').title = H.canBack ? `Back: ${H.backLabel} (${kb})` : 'Nothing to go back to';
  $('hFwd').title = H.canForward ? `Forward: ${H.forwardLabel} (${kf})` : 'Nothing to go forward to';
  $('isoBar').hidden = !s.isolate || s.view !== 'design';
  if (s.isolate) { const ew = map && map.elsewhere; $('isoName').textContent = label(s.isolate); $('isoElse').textContent = ew && (ew.files || ew.edges) ? `${ew.files} files · ${ew.edges} edges elsewhere` : ''; }
  legend(s);
}

function meter(c) {
  const col = { balanced: 'state-ok', broken: 'state-bad', stale: 'state-warn' }[c.status];
  const main = c.status === 'broken' ? `${c.unaccounted.length} not accounted for` : `${c.accounted} of ${c.edges.total} edges accounted`;
  const sub = c.status === 'stale' ? 'view made for an older graph' : `${c.edges.drawn} drawn · ${c.edges.bus} in buses · ${c.edges.folded} folded · ${c.edges.collapsed} collapsed · ${c.nodes.placed}/${c.nodes.total} files`;
  $('meter').innerHTML = `<i style="background:${v(col)}"></i><b>${main}</b><small>${sub}</small>`;

    const fi = data.edges.filter(e => e.dst === el.node).length, hp = store.get().settings.hubPlacement || data.settings.hubPlacement || 'group';
    body = `<dl class="kv"><dt>File</dt><dd>${go('node', el.node, esc(label(el.node)))}</dd><dt>Fan-in</dt><dd>${fi}</dd><dt>Fan-out</dt><dd>${data.edges.filter(e => e.src === el.node).length}</dd></dl>
      <div class="seg" style="align-self:flex-start"${store.get().isolate ? ' hidden' : ''}><span class="lbl">Placement</span>${['group', 'center'].map(x => `<button data-type="hub" data-go="${x}" aria-pressed="${hp === x}">${x === 'group' ? 'With group' : 'Centered'}</button>`).join('')}</div>`;
  } else if (p === 'set' || p === 'overlap') {
    body = `${p === 'overlap' ? `<dl class="kv"><dt>Sets</dt><dd>${el.sets.map(s => go('element', s, esc(label(s)))).join(' ∩ ')}</dd></dl>` : ''}<div><span class="eyebrow">Members · ${el.members.length}</span>${el.members.map(f => go('node', f, `<span></span><span></span><span class="n mono">${esc(label(f))}</span><span class="m"></span>`, 'erow')).join('')}</div>`;
  } else if (p === 'band') {
    body = `<div class="list">${el.levels.map((l, i) => `<div class="card"><span class="t">${i + 1}. ${esc(l.label)}</span><span class="s">${l.members.map(m => esc(label(m))).join(', ')}</span></div>`).join('')}</div>
      <div class="list"><span class="eyebrow">Exemptions</span>${(data.view.exemptions || []).map(x => go('element', x.id, `<div class="row"><span class="t">${esc(label(x.pattern.src))} → ${esc(label(x.pattern.dstIn))}</span>${chip(x.status)}</div><span class="m">${(x.approvals || []).length} of 3 approvals</span>`, 'card')).join('') || '<p>None.</p>'}</div>`;
  } else if (p === 'loop') {
    body = `<dl class="kv"><dt>Classification</dt><dd>${esc(el.classification)}</dd>${el.evidence ? `<dt>Evidence</dt><dd>${esc(el.evidence)}</dd>` : ''}</dl><div><span class="eyebrow">Cycle</span>${el.cycle.map(f => go('node', f, `<span></span><span></span><span class="n mono">${esc(label(f))}</span><span class="m"></span>`, 'erow')).join('')}</div>`;
  }
  const crumb = p === 'section' && el.parent ? `<div class="crumbs">${crumbs(el.parent).map(s => go('element', s, esc(data.elements[s].label))).join('<span>/</span>')}</div>` : '';
  return `${crumb}<div class="row"><span class="eyebrow">${PRIM[p]}</span>${chip(el.status)}</div><h2>${esc(el.label || id)}</h2><p>${esc(el.claim)}</p><span class="path">${esc(el.by)} · ${esc(id)}</span>${body}`;
}

function stagePanel(s, c) {
  const st = STAGES[s.stage - 1], S = data.stages;
  let h = `<span class="eyebrow">Stage ${st.n}</span><h2>${st.label}</h2>`;
  if (s.diff && data.diff) {
    const D = data.diff;
    h = `<span class="eyebrow">Re-run · ${s.diff.side}</span><h2>Changes since the last run</h2><p>${s.diff.side === 'after' ? 'The current map, with what changed marked. Removed files stay as ghosts until the diff is accepted.' : 'The previous map. Files added since then are drawn as outlines.'}</p>
      <div class="list">${[['added', D.added], ['changed', D.changed], ['stale', D.stale], ['removed', (D.removed || []).map(r => r.id)]].map(([k, ids]) => `<div class="card"><div class="row"><span class="t">${ids.length} ${k}</span>${chip(k, 'diff-' + k)}</div>${ids.map(id => go('node', id, `<span class="mono">${esc(label(id) || id.split('/').pop())}</span>`)).join('')}</div>`).join('')}</div>`;
    return h;
  }
  if (s.stage === 1) {
    const kinds = {}; data.edges.forEach(e => { const k = e.kind; kinds[k] = kinds[k] || { graph: 0, overlay: 0 }; kinds[k][e.origin]++; });
    const provs = {}; data.edges.forEach(e => { provs[e.provenance] = (provs[e.provenance] || 0) + 1; });
    const cr = data.graph.crawler;
    h += `<p>The crawler's output, laid out by dependency rank with no interpretation. This is the reference the design view is checked against.</p>
      <dl class="kv"><dt>Crawler</dt><dd>${esc(cr.name)} ${esc(cr.version)}</dd><dt>Granularity</dt><dd>${esc(cr.granularity)}</dd><dt>Dialect</dt><dd>${esc(cr.dialect.name)} ${esc(cr.dialect.version)}</dd><dt>Files</dt><dd>${data.nodeIds.length}</dd></dl>
      <table class="t"><thead><tr><th>Kind</th><th>Crawled</th><th>Overlay</th></tr></thead><tbody>${Object.entries(kinds).map(([k, n]) => `<tr><td>${k}</td><td>${n.graph}</td><td>${n.overlay}</td></tr>`).join('')}</tbody></table>
      <table class="t"><thead><tr><th>Provenance</th><th>Edges</th></tr></thead><tbody>${Object.entries(provs).map(([k, n]) => `<tr><td>${k}</td><td>${n}</td></tr>`).join('')}</tbody></table>`;
  } else if (s.stage === 2) {
    h += `<p>Dialect ${esc(data.view.dialect.name)}. The structure agent composed this view from ${data.order.length} elements. Each one makes a claim the audit can test.</p>`;
    Object.keys(PRIM).forEach(p => { const ids = data.byPrimitive[p]; if (ids) h += `<div class="list"><span class="eyebrow">${PRIM[p]} · ${ids.length}</span>${ids.map(elCard).join('')}</div>`; });
  } else if (s.stage === 3 && S) {
    const open = S.dialogue.filter(q => !q.answer).length;
    h += `<p>${S.dialogue.length} questions from the structure agent, ${open} open. Pins mark the file each one is about.</p><div class="list">${S.dialogue.map(q => go('node', q.node, `<div class="row"><span class="t mono">${esc(label(q.node))}</span>${chip(q.answer ? 'answered' : 'open')}</div><span class="s">${esc(q.question)}</span>${q.answer ? `<span class="s" style="color:${v('ink')}">Julian: ${esc(q.answer)}</span>` : ''}${q.effect ? `<span class="m">${esc(q.effect)}</span>` : ''}`, 'card')).join('')}</div>`;
  } else if (s.stage === 4 && S) {
    const V = { confirmed: 'pass', challenged: 'fail', open: 'warn' };
    h += `<p>${S.audit.length} findings. Element verdicts show as badges on the map; proposed elements have none yet.</p><div class="list">${S.audit.map(a => go(a.element ? 'element' : 'node', a.element || a.nodes[0], `<div class="row"><span class="t">${esc(a.nodes.map(label).join(', '))}</span>${chip(a.verdict, { confirmed: 'state-ok', challenged: 'state-bad', open: 'state-warn' }[a.verdict])}</div><span class="s">${esc(a.text)}</span><span class="m">${esc(a.by)}${a.reply ? ' · Reply: ' + esc(a.reply) : ''}</span>`, 'card')).join('')}</div>`;
  } else if (s.stage === 5 && S) {
    h += `<p>How a block of audio moves through the plugin.</p><div class="list">${S.explain.flow.map((t, i) => `<div class="card"><span class="m">${i + 1}</span><span class="s" style="color:${v('ink')}">${esc(t)}</span></div>`).join('')}</div><span class="path">${Object.keys(S.explain.notes).length} files have explainers. Select a file to read its note.</span>`;
  } else if (s.stage === 6 && S) {
    const ti = s.tour.index, t = S.tours[ti], i = Math.min(s.tour.step, t.steps.length - 1);
    h = `<span class="eyebrow">Stage 6 · tour · step ${i + 1} of ${t.steps.length}</span><h2>${esc(t.title)}</h2>
      <div class="seg" style="align-self:flex-start;flex-wrap:wrap">${S.tours.map((x, j) => `<button data-type="tourpick" data-go="${j}" aria-pressed="${j === ti}">${j + 1}</button>`).join('')}</div>
      <p style="color:${v('ink')}">${esc(t.steps[i].text)}</p>
      <div class="row" style="justify-content:flex-start"><button class="btn" data-type="tour" data-go="${Math.max(0, i - 1)}">Back</button><button class="btn primary" data-type="tour" data-go="${Math.min(t.steps.length - 1, i + 1)}">Next step</button></div>
      <div class="list">${t.steps.map((x, j) => `<button class="card${j === i ? ' on' : ''}" data-type="tour" data-go="${j}"><span class="t">${j + 1}. <span class="mono">${esc(label(x.node))}</span></span><span class="s">${esc(x.text)}</span></button>`).join('')}</div>`;
  } else h += '<p>No stage data in this snapshot yet.</p>';
  return h;
}

function unaccountedPanel(c) {
  return `<span class="eyebrow">Conservation</span><h2>${c.unaccounted.length} not accounted for</h2><p>These ids are neither drawn, in a bus, folded nor inside a collapsed group.</p><div>${c.unaccounted.map(id => `<div class="erow"><span></span><span></span><span class="n path">${esc(id)}</span><span></span></div>`).join('')}</div>`;
}

let lastTourNode = null;
function panel(s, c) {
  // tour step drives the selection highlight
  if (s.stage === 6 && data.stages && !s.selection) {
    const t = data.stages.tours[s.tour.index], node = t && t.steps[Math.min(s.tour.step, t.steps.length - 1)].node;
    if (node !== lastTourNode) { lastTourNode = node; }
  }
  const sel = s.selection;
  let html = '', title = '';
  if (sel && sel.type === 'node') { html = nodePanel(sel.id); title = label(sel.id); }
  else if (sel && sel.type === 'element') { html = elementPanel(sel.id); title = label(sel.id); }
  else if (sel && sel.type === 'edge') { html = edgePanel(sel.id); title = 'Edge'; }
  else if (sel && sel.type === 'unaccounted') { html = unaccountedPanel(c); title = 'Conservation'; }
  if (!html) { html = stagePanel(s, c); title = s.diff ? 'Re-run diff' : `Stage ${s.stage} · ${STAGES[s.stage - 1].label}`; }
  else html = `<div class="row"><span></span><button class="path" data-type="clear" data-go="x" style="color:${v('ink-muted')}">Back to stage</button></div>` + html;
  const key = JSON.stringify([sel, s.stage, s.tour, s.diff, s.collapsed, s.settings, s.unfolded, s.isolate]);
  if (pb.dataset.key !== key) { pb.innerHTML = html; pb.dataset.key = key; pb.scrollTop = 0; }
  $('handleText').textContent = title;
}
pb.addEventListener('click', e => { const b = e.target.closest('[data-type="clear"]'); if (b) { e.stopPropagation(); A.clear(); } }, true);

window.loupe = { store, data, render: () => paint(), get map() { return map; } };
paint();
</script>
</body>
</html>
